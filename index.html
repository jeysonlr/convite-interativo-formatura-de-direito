<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#160003"
  >

  <meta
    name="description"
    content="Convite de Formatura em Direito de Heloisa Fernanda Galvão Romualdo"
  >

  <title>
    Formatura Heloisa • Direito
  </title>

  <style>

    /* =========================================
       RESET
    ========================================= */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #080001;
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
    }

    body {
      overscroll-behavior: none;
    }

    button {
      font-family: inherit;
    }


    /* =========================================
       TELA DE ABERTURA
    ========================================= */

    #intro {
      position: fixed;
      inset: 0;
      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at 50% 25%,
          #650b17 0%,
          #270006 45%,
          #080001 100%
        );

      transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
    }

    #intro.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }


    /* brilho decorativo */

    #intro::before {
      content: "";
      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(255, 215, 150, 0.08),
          transparent 25%
        ),
        radial-gradient(
          circle at 80% 70%,
          rgba(255, 215, 150, 0.06),
          transparent 25%
        );

      pointer-events: none;
    }


    /* =========================================
       CAPA
    ========================================= */

    .cover-wrapper {
      position: relative;

      width: min(92vw, 430px);
      max-height: 92vh;

      display: flex;
      justify-content: center;

      animation: coverEntrance 1.2s ease both;
    }

    .cover-image {
      display: block;

      max-width: 100%;
      max-height: 88vh;

      width: auto;
      height: auto;

      object-fit: contain;

      border-radius: 4px;

      box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.8),
        0 0 50px rgba(180, 30, 45, 0.18);

      user-select: none;
      -webkit-user-drag: none;
    }


    /* botão invisível cobrindo a capa */

    .open-button {
      position: absolute;
      inset: 0;

      border: 0;
      background: transparent;

      cursor: pointer;
    }


    /* indicação inferior */

    .open-hint {
      position: absolute;

      bottom: 4%;
      left: 50%;

      transform: translateX(-50%);

      padding: 9px 16px;

      border-radius: 999px;

      background: rgba(0, 0, 0, 0.45);

      border:
        1px solid
        rgba(240, 204, 135, 0.55);

      color: #f3d699;

      font-size: 11px;
      letter-spacing: 0.16em;

      white-space: nowrap;

      backdrop-filter: blur(6px);

      animation: pulse 1.8s infinite;
    }


    /* =========================================
       EXPERIÊNCIA PRINCIPAL
    ========================================= */

    #experience {
      position: fixed;
      inset: 0;

      display: none;

      background:
        radial-gradient(
          circle at 50% 20%,
          #350007,
          #0a0002 65%
        );

      overflow: hidden;
    }

    #experience.active {
      display: block;
    }


    /* =========================================
       SLIDER
    ========================================= */

    .slider {
      position: absolute;
      inset: 0;

      display: flex;

      transition:
        transform 0.7s
        cubic-bezier(.77, 0, .18, 1);

      will-change: transform;
    }


    /* =========================================
       CADA SLIDE
    ========================================= */

    .slide {
      position: relative;

      min-width: 100vw;
      width: 100vw;
      height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        max(16px, env(safe-area-inset-top))
        16px
        max(72px, env(safe-area-inset-bottom));

      overflow: hidden;
    }


    /* fundo desfocado usando a própria imagem */

    .slide-background {
      position: absolute;
      inset: -30px;

      background-image: var(--background);
      background-position: center;
      background-size: cover;

      filter:
        blur(28px)
        brightness(0.28)
        saturate(1.25);

      transform: scale(1.12);

      opacity: 0.9;
    }


    /* vinheta */

    .slide::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          ellipse at center,
          transparent 45%,
          rgba(0, 0, 0, 0.55) 100%
        );

      pointer-events: none;
    }


    /* imagem inteira */

    .slide-image {
      position: relative;
      z-index: 2;

      display: block;

      width: auto;
      height: auto;

      max-width: min(94vw, 600px);
      max-height: calc(100dvh - 100px);

      object-fit: contain;

      border-radius: 3px;

      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.75);

      user-select: none;
      -webkit-user-drag: none;

      opacity: 0;

      transform:
        scale(0.965)
        translateY(12px);

      transition:
        opacity 0.8s ease,
        transform 0.9s ease;
    }


    /* slide ativo */

    .slide.active .slide-image {
      opacity: 1;

      transform:
        scale(1)
        translateY(0);
    }


    /* =========================================
       SETAS
    ========================================= */

    .nav-button {
      position: fixed;

      top: 50%;

      z-index: 20;

      width: 48px;
      height: 48px;

      transform: translateY(-50%);

      border-radius: 50%;

      border:
        1px solid
        rgba(236, 203, 133, 0.6);

      background:
        rgba(25, 0, 4, 0.7);

      color: #f0d393;

      font-size: 27px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      backdrop-filter: blur(8px);

      transition:
        opacity 0.3s,
        transform 0.3s,
        background 0.3s;
    }

    .nav-button:hover {
      background:
        rgba(100, 8, 20, 0.9);
    }

    .nav-button:active {
      transform:
        translateY(-50%)
        scale(0.9);
    }

    #previous {
      left: 14px;
    }

    #next {
      right: 14px;
    }

    .nav-button.disabled {
      opacity: 0.18;
      pointer-events: none;
    }


    /* =========================================
       CONTADOR
    ========================================= */

    .counter {
      position: fixed;

      top:
        max(
          15px,
          env(safe-area-inset-top)
        );

      right: 18px;

      z-index: 25;

      padding: 8px 13px;

      border-radius: 999px;

      background:
        rgba(10, 0, 2, 0.65);

      border:
        1px solid
        rgba(232, 198, 124, 0.35);

      color: #efd18e;

      font-size: 12px;

      letter-spacing: 0.1em;

      backdrop-filter: blur(8px);
    }


    /* =========================================
       INDICADORES INFERIORES
    ========================================= */

    .pagination {
      position: fixed;

      left: 50%;

      bottom:
        max(
          20px,
          env(safe-area-inset-bottom)
        );

      transform: translateX(-50%);

      z-index: 30;

      display: flex;

      gap: 8px;

      padding: 10px 13px;

      border-radius: 999px;

      background:
        rgba(12, 0, 2, 0.65);

      border:
        1px solid
        rgba(232, 198, 124, 0.25);

      backdrop-filter: blur(8px);
    }

    .dot {
      width: 7px;
      height: 7px;

      border: 0;
      padding: 0;

      border-radius: 50%;

      background:
        rgba(255, 255, 255, 0.28);

      cursor: pointer;

      transition:
        width 0.3s,
        background 0.3s;
    }

    .dot.active {
      width: 22px;

      border-radius: 20px;

      background: #e8c77f;
    }


    /* =========================================
       TEXTO DE SWIPE
    ========================================= */

    .swipe-hint {
      position: fixed;

      bottom:
        max(
          62px,
          calc(env(safe-area-inset-bottom) + 52px)
        );

      left: 50%;

      transform: translateX(-50%);

      z-index: 25;

      color:
        rgba(255, 255, 255, 0.55);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 10px;

      letter-spacing: 0.13em;

      white-space: nowrap;

      pointer-events: none;

      transition: opacity 0.5s;
    }


    /* =========================================
       ANIMAÇÕES
    ========================================= */

    @keyframes coverEntrance {

      from {
        opacity: 0;
        transform:
          translateY(25px)
          scale(0.96);
      }

      to {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }

    }


    @keyframes pulse {

      0%,
      100% {
        transform:
          translateX(-50%)
          scale(1);
      }

      50% {
        transform:
          translateX(-50%)
          scale(1.04);
      }

    }


    /* =========================================
       DESKTOP
    ========================================= */

    @media (min-width: 800px) {

      .slide-image {
        max-width: min(86vw, 630px);
        max-height: calc(100vh - 70px);
      }

      .nav-button {
        width: 54px;
        height: 54px;
      }

      #previous {
        left: 30px;
      }

      #next {
        right: 30px;
      }

    }


    /* =========================================
       CELULAR
    ========================================= */

    @media (max-width: 600px) {

      .slide {
        padding:
          max(8px, env(safe-area-inset-top))
          7px
          max(68px, env(safe-area-inset-bottom));
      }

      .slide-image {
        max-width: 97vw;
        max-height: calc(100dvh - 78px);
      }

      .nav-button {
        width: 39px;
        height: 39px;

        font-size: 22px;

        background:
          rgba(10, 0, 2, 0.52);
      }

      #previous {
        left: 5px;
      }

      #next {
        right: 5px;
      }

      .counter {
        top:
          max(
            8px,
            env(safe-area-inset-top)
          );

        right: 9px;
      }

    }


    /* =========================================
       TELAS BAIXAS
    ========================================= */

    @media (max-height: 700px) {

      .slide-image {
        max-height: calc(100dvh - 60px);
      }

      .pagination {
        bottom: 8px;
      }

      .swipe-hint {
        display: none;
      }

    }

  </style>
</head>


<body>


<!-- =========================================
     ABERTURA
========================================= -->

<section id="intro">

  <div class="cover-wrapper">

    <img
      class="cover-image"
      src="assets/slide-01-capa.png"
      alt="Convite de formatura de Heloisa Fernanda Galvão Romualdo"
    >

    <button
      class="open-button"
      type="button"
      aria-label="Abrir convite"
      onclick="openInvitation()"
    ></button>

    <div class="open-hint">
      TOQUE PARA ABRIR
    </div>

  </div>

</section>



<!-- =========================================
     EXPERIÊNCIA
========================================= -->

<main id="experience">

  <div
    id="slider"
    class="slider"
  >


    <!-- SLIDE 02 -->

    <section
      class="slide active"
      style="
        --background:
        url('assets/slide-02-direito.png')
      "
    >

      <div class="slide-background"></div>

      <img
        class="slide-image"
        src="assets/slide-02-direito.png"
        alt="Formatura em Direito"
      >

    </section>


    <!-- SLIDE 03 -->

    <section
      class="slide"
      style="
        --background:
        url('assets/slide-03-convite.png')
      "
    >

      <div class="slide-background"></div>

      <img
        class="slide-image"
        src="assets/slide-03-convite.png"
        alt="Mensagem do convite"
      >

    </section>


    <!-- SLIDE 04 -->

    <section
      class="slide"
      style="
        --background:
        url('assets/slide-04-data-local.png')
      "
    >

      <div class="slide-background"></div>

      <img
        class="slide-image"
        src="assets/slide-04-data-local.png"
        alt="Data, horário e local"
      >

    </section>


    <!-- SLIDE 05 -->

    <section
      class="slide"
      style="
        --background:
        url('assets/slide-05-festa.png')
      "
    >

      <div class="slide-background"></div>

      <img
        class="slide-image"
        src="assets/slide-05-festa.png"
        alt="Informações da comemoração"
      >

    </section>


    <!-- SLIDE 06 -->

    <section
      class="slide"
      style="
        --background:
        url('assets/slide-06-criancas.png')
      "
    >

      <div class="slide-background"></div>

      <img
        class="slide-image"
        src="assets/slide-06-criancas.png"
        alt="Informações para crianças"
      >

    </section>


    <!-- SLIDE 07 -->

    <section
      class="slide"
      style="
        --background:
        url('assets/slide-07-dress-code.png')
      "
    >

      <div class="slide-background"></div>

      <img
        class="slide-image"
        src="assets/slide-07-dress-code.png"
        alt="Dress code"
      >

    </section>


    <!-- SLIDE 08 -->

    <section
      class="slide"
      style="
        --background:
        url('assets/slide-08-formanda.png')
      "
    >

      <div class="slide-background"></div>

      <img
        class="slide-image"
        src="assets/slide-08-formanda.png"
        alt="Heloisa celebrando sua formatura"
      >

    </section>


    <!-- SLIDE 09 -->

    <section
      class="slide"
      style="
        --background:
        url('assets/slide-09-valores.png')
      "
    >

      <div class="slide-background"></div>

      <img
        class="slide-image"
        src="assets/slide-09-valores.png"
        alt="Valores dos convites"
      >

    </section>

  </div>



  <!-- =======================================
       CONTADOR
  ======================================== -->

  <div
    id="counter"
    class="counter"
  >
    1 / 8
  </div>



  <!-- =======================================
       SETA ANTERIOR
  ======================================== -->

  <button
    id="previous"
    class="nav-button disabled"
    type="button"
    aria-label="Slide anterior"
    onclick="previousSlide()"
  >
    ‹
  </button>



  <!-- =======================================
       SETA PRÓXIMA
  ======================================== -->

  <button
    id="next"
    class="nav-button"
    type="button"
    aria-label="Próximo slide"
    onclick="nextSlide()"
  >
    ›
  </button>



  <!-- =======================================
       AJUDA
  ======================================== -->

  <div
    id="swipeHint"
    class="swipe-hint"
  >
    DESLIZE PARA CONTINUAR
  </div>



  <!-- =======================================
       PAGINAÇÃO
  ======================================== -->

  <div
    id="pagination"
    class="pagination"
  ></div>

</main>



<script>

  /* =========================================
     CONFIGURAÇÃO
  ========================================= */

  let currentSlide = 0;

  const slider =
    document.getElementById("slider");

  const slides =
    Array.from(
      document.querySelectorAll(".slide")
    );

  const totalSlides =
    slides.length;

  const counter =
    document.getElementById("counter");

  const previousButton =
    document.getElementById("previous");

  const nextButton =
    document.getElementById("next");

  const pagination =
    document.getElementById("pagination");

  const swipeHint =
    document.getElementById("swipeHint");



  /* =========================================
     CRIA OS INDICADORES
  ========================================= */

  slides.forEach((slide, index) => {

    const dot =
      document.createElement("button");

    dot.type = "button";

    dot.className =
      index === 0
        ? "dot active"
        : "dot";

    dot.setAttribute(
      "aria-label",
      `Ir para slide ${index + 1}`
    );

    dot.addEventListener(
      "click",
      () => goToSlide(index)
    );

    pagination.appendChild(dot);

  });



  /* =========================================
     ABRIR CONVITE
  ========================================= */

  function openInvitation() {

    const intro =
      document.getElementById("intro");

    const experience =
      document.getElementById("experience");

    intro.classList.add("hidden");

    experience.classList.add("active");

    document.body.style.overflow =
      "hidden";

    goToSlide(0);

  }



  /* =========================================
     IR PARA SLIDE
  ========================================= */

  function goToSlide(index) {

    if (index < 0) {
      index = 0;
    }

    if (index >= totalSlides) {
      index = totalSlides - 1;
    }

    currentSlide = index;

    slider.style.transform =
      `translateX(-${currentSlide * 100}vw)`;



    /* slides ativos */

    slides.forEach(
      (slide, slideIndex) => {

        slide.classList.toggle(
          "active",
          slideIndex === currentSlide
        );

      }
    );



    /* paginação */

    const dots =
      document.querySelectorAll(".dot");

    dots.forEach(
      (dot, dotIndex) => {

        dot.classList.toggle(
          "active",
          dotIndex === currentSlide
        );

      }
    );



    /* contador */

    counter.textContent =
      `${currentSlide + 1} / ${totalSlides}`;



    /* botões */

    previousButton.classList.toggle(
      "disabled",
      currentSlide === 0
    );

    nextButton.classList.toggle(
      "disabled",
      currentSlide === totalSlides - 1
    );



    /* remove dica depois do primeiro avanço */

    if (currentSlide > 0) {

      swipeHint.style.opacity = "0";

    }

  }



  /* =========================================
     PRÓXIMO
  ========================================= */

  function nextSlide() {

    if (
      currentSlide <
      totalSlides - 1
    ) {

      goToSlide(
        currentSlide + 1
      );

    }

  }



  /* =========================================
     ANTERIOR
  ========================================= */

  function previousSlide() {

    if (
      currentSlide > 0
    ) {

      goToSlide(
        currentSlide - 1
      );

    }

  }



  /* =========================================
     SWIPE MOBILE
  ========================================= */

  let touchStartX = 0;

  let touchStartY = 0;

  let touchEndX = 0;

  let touchEndY = 0;



  document.addEventListener(
    "touchstart",
    event => {

      touchStartX =
        event.changedTouches[0].screenX;

      touchStartY =
        event.changedTouches[0].screenY;

    },
    {
      passive: true
    }
  );



  document.addEventListener(
    "touchend",
    event => {

      touchEndX =
        event.changedTouches[0].screenX;

      touchEndY =
        event.changedTouches[0].screenY;

      handleSwipe();

    },
    {
      passive: true
    }
  );



  function handleSwipe() {

    const horizontalDistance =
      touchEndX - touchStartX;

    const verticalDistance =
      touchEndY - touchStartY;



    /* evita interpretar rolagem vertical
       como swipe horizontal */

    if (
      Math.abs(horizontalDistance) <
      Math.abs(verticalDistance)
    ) {
      return;
    }



    const minimumSwipe = 45;



    /* swipe para esquerda */

    if (
      horizontalDistance <
      -minimumSwipe
    ) {

      nextSlide();

    }



    /* swipe para direita */

    if (
      horizontalDistance >
      minimumSwipe
    ) {

      previousSlide();

    }

  }



  /* =========================================
     TECLADO NO COMPUTADOR
  ========================================= */

  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "ArrowRight"
      ) {

        nextSlide();

      }

      if (
        event.key === "ArrowLeft"
      ) {

        previousSlide();

      }

    }
  );



  /* =========================================
     PRELOAD DAS IMAGENS
  ========================================= */

  const images = [

    "assets/slide-02-direito.png",

    "assets/slide-03-convite.png",

    "assets/slide-04-data-local.png",

    "assets/slide-05-festa.png",

    "assets/slide-06-criancas.png",

    "assets/slide-07-dress-code.png",

    "assets/slide-08-formanda.png",

    "assets/slide-09-valores.png"

  ];



  images.forEach(
    source => {

      const image =
        new Image();

      image.src =
        source;

    }
  );

</script>


</body>
</html>
